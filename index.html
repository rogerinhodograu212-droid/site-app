<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu App</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            color: #222;
            text-align: center;
        }

        .container {
            max-width: 600px;
            margin: 100px auto;
            padding: 40px 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .icone {
            width: 100px;
            height: 100px;
            background: #4f46e5;
            border-radius: 20px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 40px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            font-size: 18px;
            line-height: 1.5;
        }

        .download {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 30px;
            background: #4f46e5;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
        }

        .download:hover {
            background: #3730a3;
        }

        .versao {
            margin-top: 15px;
            font-size: 14px;
            color: #999;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icone">
            📱
        </div>

        <h1>Meu App</h1>

        <p>
            Baixe agora o meu aplicativo e aproveite
            todos os recursos de forma rápida e fácil.
        </p>

        <a class="download" href="meu-app.apk" download>
            ⬇ Baixar App
        </a>

        <div class="versao">
            Versão 1.0.0 • Android
        </div>

    </div>

</body>
</html>
